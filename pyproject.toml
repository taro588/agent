[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameart-ai-toolkit"
version = "0.1.0"
description = "GameArt AI Toolkit for Maya and 3ds Max"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gameart = "src.launcher_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
