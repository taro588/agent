name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements.txt
      - name: Build GameArtAI.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name GameArtAI --add-data "plugins;plugins" --paths . installer/GameArtAI.py
          if (!(Test-Path dist/GameArtAI.exe)) { throw "GameArtAI.exe was not produced" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/GameArtAI.iss
          if (!(Test-Path Output/GameArt-AI-Toolkit-Setup.exe)) { throw "Setup EXE was not produced" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GameArt-AI-Toolkit-Windows
          path: Output/GameArt-AI-Toolkit-Setup.exe
