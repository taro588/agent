name: Build GameArt Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "dcc/**"
      - "plugins/**"
      - "pyproject.toml"
      - ".github/workflows/gameart-windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Build one-click GameArt EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          py -3 -m pip install --disable-pip-version-check pyinstaller
          py -3 -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "GameArt-AI-Toolkit-Installer" `
            --add-data "src;src" `
            --add-data "dcc;dcc" `
            --add-data "plugins;plugins" `
            --add-data "requirements-ai.txt;." `
            --hidden-import "plugins.substance_painter.installer" `
            --hidden-import "plugins.substance_painter.remote_client" `
            --hidden-import "plugins.substance_painter.openai_tools" `
            --hidden-import "src.ai.provider" `
            src/installer_app.py
          $exe = "dist\GameArt-AI-Toolkit-Installer.exe"
          if (!(Test-Path $exe)) { throw "GameArt installer EXE was not produced." }
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GameArt-AI-Toolkit-Installer
          path: dist/GameArt-AI-Toolkit-Installer.exe
          if-no-files-found: error
      - name: Launch UI and capture screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path test | Out-Null
          $p = Start-Process -FilePath "$PWD\dist\GameArt-AI-Toolkit-Installer.exe" -PassThru
          Start-Sleep -Seconds 5
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$PWD\test\GameArt-AI-Toolkit-Installer.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (!(Test-Path "test\GameArt-AI-Toolkit-Installer.png")) { throw "Screenshot was not created." }

      - name: End-to-end EXE launch and clean-state verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "GameArt-AI-Toolkit"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue }
          $p = Start-Process -FilePath "$PWD\dist\GameArt-AI-Toolkit-Installer.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "Installer exited unexpectedly: $($p.ExitCode)" }
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $root) { throw "Installer created state before user action." }

      - name: Upload UI screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GameArt-AI-Toolkit-Installer-UI
          path: test/GameArt-AI-Toolkit-Installer.png
          if-no-files-found: error
      - name: End-to-end plugin installer smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $PWD "test\plugin-smoke"
          $maya = Join-Path $PWD "test\maya-user"
          $max = Join-Path $PWD "test\max-user"
          New-Item -ItemType Directory -Force -Path $root,$maya,$max | Out-Null
          $env:GAMEART_MAYA_USER_SCRIPTS = $maya
          $env:GAMEART_MAX_USER_STARTUP = Join-Path $max "startup"
          $env:PYTHONPATH = $PWD
          @'
          from pathlib import Path
          from src.core.plugin_installer import PluginInstaller, KNOWN_PLUGINS
          root = Path("test/plugin-smoke").resolve()
          installer = PluginInstaller(root)
          failures = []
          for name in KNOWN_PLUGINS:
              result = installer.install(name)
              print(name, result.ok, result.error or "")
              if not result.ok:
                  failures.append(name)
          installed = {item["name"] for item in installer.installed()}
          print("installed:", sorted(installed))
          for name in list(installed):
              result = installer.uninstall(name)
              print("uninstall", name, result.ok, result.error or "")
              if not result.ok:
                  failures.append("uninstall:" + name)
          if failures:
              raise SystemExit("Plugin smoke failures: " + ", ".join(failures))
          print("All declared plugins installed and removed successfully.")
          '@ | Set-Content -Encoding UTF8 test\plugin_smoke.py
          py -3 test\plugin_smoke.py