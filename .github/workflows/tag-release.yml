name: Tag release on explicit version commit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create annotated version tag
        if: startsWith(github.event.head_commit.message, 'release v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euxo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          message="$RELEASE_MESSAGE"
          test "$tag" = "${message#release }"
          commit="$GITHUB_SHA"
          if gh api "repos/taro588/agent/git/ref/refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag"
            exit 0
          fi
          tag_sha="$(gh api --method POST "repos/taro588/agent/git/tags" -f tag="$tag" -f message="Release $tag" -f object="$commit" -f type="commit" --jq '.sha')"
          echo "created tag object: $tag_sha"
          gh api --method POST "repos/taro588/agent/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_sha"
